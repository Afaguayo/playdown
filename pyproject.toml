[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "playdown"
version = "0.2.0"
description = "Paste a Spotify playlist link, get a folder of tagged audio files for your DJ sets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "yt-dlp[default]>=2026.1.1",
    "mutagen>=1.47",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6.10"]

[project.scripts]
playdown = "playdown.cli:main"

[project.gui-scripts]
playdown-gui = "playdown.gui:main"

[tool.setuptools]
packages = ["playdown"]

[tool.setuptools.package-data]
playdown = ["assets/*", "assets/fonts/*"]
